[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "arabic-slug"
version = "0.1.0"
description = "URL slugs for Arabic text: transliterated or kept as Arabic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdulluh.X", email = "199844698+hfip@users.noreply.github.com" }]
keywords = ["arabic", "slug", "slugify", "url", "transliteration", "seo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
arabic-slug = "arabic_slug.cli:main"

[project.urls]
Homepage = "https://github.com/hfip/arabic-slug"
Issues = "https://github.com/hfip/arabic-slug/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_slug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
